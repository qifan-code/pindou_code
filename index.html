<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARD 291 拼豆图纸生成器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; background:#f5f6f8; color:#222; }
    .app { max-width: 1500px; margin: 0 auto; padding: 22px; }
    h1 { margin: 0 0 6px; font-size: 30px; }
    .subtitle { color:#666; margin-bottom: 20px; }
    .layout { display:grid; grid-template-columns: 340px 1fr; gap:20px; }
    .panel { background:#fff; border-radius:16px; padding:18px; box-shadow:0 4px 18px rgba(0,0,0,.06); }
    .section { margin-bottom:24px; }
    .section h3 { margin:0 0 12px; font-size:17px; }
    input[type=file] { width:100%; }
    #preview { width:100%; max-height:220px; object-fit:contain; display:none; margin-top:12px; border-radius:10px; border:1px solid #eee; }
    .size-options { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .simplify-options { grid-template-columns:repeat(3,1fr); }
    .size-btn, .tab-btn, .tool-btn {
      border:1px solid #ccc; background:#fff; border-radius:10px; padding:10px; cursor:pointer;
    }
    .size-btn.active, .tab-btn.active { border-color:#1677ff; color:#1677ff; background:#eef5ff; font-weight:700; }
    label { display:flex; align-items:center; gap:8px; margin:10px 0; }
    .primary { width:100%; border:0; background:#111; color:#fff; padding:13px; border-radius:10px; cursor:pointer; font-size:16px; }
    .secondary { width:100%; border:1px solid #ccc; background:#fff; padding:11px; border-radius:10px; cursor:pointer; margin-top:10px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .canvas-wrap { overflow:auto; border:1px solid #ddd; border-radius:12px; background:#fafafa; padding:16px; text-align:center; }
    canvas { background:#fff; max-width:100%; height:auto; }
    .summary { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:14px; }
    .color-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:9px; }
    .color-row { display:flex; align-items:center; gap:10px; border:1px solid #eee; border-radius:8px; padding:8px; background:#fafafa; }
    .swatch { width:30px; height:30px; border:1px solid #aaa; border-radius:5px; flex:0 0 auto; }
    .small { color:#777; font-size:12px; }
    .status { padding:10px 12px; border-radius:8px; background:#f3f6fa; font-size:13px; margin-top:10px; }
    .range-row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    input[type=range] { width:100%; }
    @media(max-width:900px){ .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="app">
  <h1>MARD 291 拼豆图纸生成器</h1>
  <div class="subtitle">照片 → 颜色简化 → MARD 291 匹配 → 52 / 78 / 104 图纸 → 5×5 分组网格 → 用豆统计</div>

  <div class="layout">
    <div class="panel">
      <div class="section">
        <h3>1. 上传图片</h3>
        <input id="fileInput" type="file" accept="image/*" />
        <img id="preview" alt="preview" />
      </div>

      <div class="section">
        <h3>2. 选择尺寸</h3>
        <div class="size-options">
          <button class="size-btn active" data-size="52">52×52</button>
          <button class="size-btn" data-size="78">78×78</button>
          <button class="size-btn" data-size="104">104×104</button>
        </div>
      </div>

      <div class="section">
        <h3>3. 图纸设置</h3>
        <label><input id="showCodes" type="checkbox" checked />显示色号</label>
        <label><input id="showCoords" type="checkbox" checked />显示坐标</label>
        <label><input id="bold5" type="checkbox" checked />每 5 格加粗</label>
      </div>

      <div class="section">
        <h3>4. 图片处理</h3>
        <div class="range-row">
          <input id="contrast" type="range" min="70" max="140" value="105" />
          <span id="contrastValue">105%</span>
        </div>
        <div class="range-row">
          <input id="saturation" type="range" min="70" max="140" value="110" />
          <span id="saturationValue">110%</span>
        </div>
      </div>

      <div class="section">
        <h3>5. 颜色简化</h3>
        <div class="size-options simplify-options">
          <button class="tool-btn simplify-btn active" data-colors="auto">自动</button>
          <button class="tool-btn simplify-btn" data-colors="12">12色</button>
          <button class="tool-btn simplify-btn" data-colors="18">18色</button>
          <button class="tool-btn simplify-btn" data-colors="24">24色</button>
          <button class="tool-btn simplify-btn" data-colors="36">36色</button>
          <button class="tool-btn simplify-btn" data-colors="0">不限</button>
        </div>
        <div class="small" id="simplifyHint" style="margin-top:8px">自动：52×52≈18色，78×78≈24色，104×104≈36色</div>
      </div>

      <button id="generateBtn" class="primary">生成拼豆图纸</button>
      <button id="downloadBtn" class="secondary">下载图纸 + 材料清单 PNG</button>

      <div id="paletteStatus" class="status">正在加载 MARD 291 色卡…</div>
    </div>

    <div>
      <div class="panel">
        <div class="tabs">
          <button class="tab-btn active" data-mode="pattern">图纸模式</button>
          <button class="tab-btn" data-mode="color">纯颜色</button>
          <button class="tab-btn" data-mode="code">色号模式</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="patternCanvas"></canvas>
        </div>
      </div>

      <div class="panel" style="margin-top:20px">
        <div class="summary">
          <div>尺寸：<strong id="sumSize">52×52</strong></div>
          <div>总颗数：<strong id="sumTotal">2704</strong></div>
          <div>使用颜色：<strong id="sumColors">0</strong></div>
        </div>
        <div id="colorList" class="color-list"></div>
      </div>
    </div>
  </div>
</div>

let img = null;
let boardSize = 52;
let mode = "pattern";
let simplifyColors = "auto";
let pattern = [];
let counts = {};

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const canvas = document.getElementById("patternCanvas");
const ctx = canvas.getContext("2d");
const paletteStatus = document.getElementById("paletteStatus");


function rgbToHex(r,g,b) {
  return "#" + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("").toUpperCase();
}

function srgbToLinear(c) {
  c /= 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055)/1.055, 2.4);
}

function rgbToLab(r,g,b) {
  const R = srgbToLinear(r), G = srgbToLinear(g), B = srgbToLinear(b);
  let X = R*0.4124564 + G*0.3575761 + B*0.1804375;
  let Y = R*0.2126729 + G*0.7151522 + B*0.0721750;
  let Z = R*0.0193339 + G*0.1191920 + B*0.9503041;
  X /= 0.95047; Y /= 1.00000; Z /= 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787*t + 16/116;
  const fx=f(X), fy=f(Y), fz=f(Z);
  return { L:116*fy-16, a:500*(fx-fy), b:200*(fy-fz) };
}

function deltaE76(l1,l2) {
  return Math.hypot(l1.L-l2.L, l1.a-l2.a, l1.b-l2.b);
}

function nearestBead(r,g,b) {
  const lab = rgbToLab(r,g,b);
  let best = palette[0], bestD = Infinity;
  for (const bead of palette) {
    const d = deltaE76(lab, bead.lab);
    if (d < bestD) { bestD = d; best = bead; }
  }
  return best;
}

fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  preview.src = url;
  preview.style.display = "block";
  const temp = new Image();
  temp.onload = () => img = temp;
  temp.src = url;
});

document.querySelectorAll(".size-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    boardSize = Number(btn.dataset.size);
  });
});

document.querySelectorAll(".simplify-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".simplify-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    simplifyColors = btn.dataset.colors;
  });
});

function getTargetColorCount() {
  if (simplifyColors === "0") return 0;
  if (simplifyColors !== "auto") return Number(simplifyColors);
  if (boardSize === 52) return 18;
  if (boardSize === 78) return 24;
  return 36;
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    if (pattern.length) redraw();
  });
});

["showCodes","showCoords","bold5"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => pattern.length && redraw());
});

["contrast","saturation"].forEach(id => {
  const el = document.getElementById(id);
  const out = document.getElementById(id+"Value");
  el.addEventListener("input", () => out.textContent = el.value + "%");
});

document.getElementById("generateBtn").addEventListener("click", generate);
document.getElementById("downloadBtn").addEventListener("click", download);

function getSquareCrop(image) {
  const s = Math.min(image.width, image.height);
  return { sx:(image.width-s)/2, sy:(image.height-s)/2, s };
}


function getPixelLabs(data) {
  const labs = new Array(boardSize * boardSize);
  const rgbs = new Array(boardSize * boardSize);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    const r = data[i], g = data[i+1], b = data[i+2];
    rgbs[p] = {r,g,b};
    labs[p] = rgbToLab(r,g,b);
  }
  return {labs, rgbs};
}

function seededIndices(length, k) {
  const out = [];
  if (k <= 0) return out;
  for (let i = 0; i < k; i++) {
    out.push(Math.min(length - 1, Math.floor((i + 0.5) * length / k)));
  }
  return out;
}

// K-means in Lab space. This reduces photographic noise before mapping to real MARD colors.
function kMeansLab(labs, k, iterations = 10) {
  if (!k || k >= labs.length) return null;

  // Deterministic initialization from luminance-sorted samples.
  const order = labs.map((lab, i) => ({lab, i})).sort((a,b) => a.lab.L - b.lab.L);
  let centers = seededIndices(order.length, k).map(idx => ({...order[idx].lab}));
  let assignments = new Int16Array(labs.length);

  for (let iter = 0; iter < iterations; iter++) {
    const sums = Array.from({length:k}, () => ({L:0,a:0,b:0,n:0}));

    for (let i = 0; i < labs.length; i++) {
      let best = 0, bestD = Infinity;
      const lab = labs[i];
      for (let c = 0; c < k; c++) {
        const dL = lab.L - centers[c].L;
        const da = lab.a - centers[c].a;
        const db = lab.b - centers[c].b;
        const d = dL*dL + da*da + db*db;
        if (d < bestD) { bestD = d; best = c; }
      }
      assignments[i] = best;
      const s = sums[best];
      s.L += lab.L; s.a += lab.a; s.b += lab.b; s.n++;
    }

    let movement = 0;
    for (let c = 0; c < k; c++) {
      const s = sums[c];
      if (!s.n) continue;
      const next = {L:s.L/s.n, a:s.a/s.n, b:s.b/s.n};
      movement += deltaE76(centers[c], next);
      centers[c] = next;
    }
    if (movement < 0.1) break;
  }

  return {centers, assignments};
}

function nearestBeadToLab(lab) {
  let best = palette[0], bestD = Infinity;
  for (const bead of palette) {
    const d = deltaE76(lab, bead.lab);
    if (d < bestD) { bestD = d; best = bead; }
  }
  return best;
}

function simplifyToMard(labs, targetCount) {
  // Unlimited: match every pixel directly to the 291-color palette.
  if (!targetCount) {
    return labs.map(lab => nearestBeadToLab(lab));
  }

  const km = kMeansLab(labs, targetCount, 12);
  if (!km) return labs.map(lab => nearestBeadToLab(lab));

  // Convert each cluster center to a real MARD color.
  // Several centers may land on the same bead, so dedupe them.
  const selectedMap = new Map();
  for (const center of km.centers) {
    const bead = nearestBeadToLab(center);
    selectedMap.set(bead.code, bead);
  }
  const selected = [...selectedMap.values()];

  // Reassign every original pixel to the closest bead among the selected MARD colors.
  return labs.map(lab => {
    let best = selected[0], bestD = Infinity;
    for (const bead of selected) {
      const d = deltaE76(lab, bead.lab);
      if (d < bestD) { bestD = d; best = bead; }
    }
    return best;
  });
}

function generate() {
  if (!img) return alert("请先上传图片");
  if (!palette.length) return alert("MARD 291 色卡还没有加载完成");

  const off = document.createElement("canvas");
  off.width = boardSize;
  off.height = boardSize;
  const octx = off.getContext("2d");

  const crop = getSquareCrop(img);

  octx.filter = `contrast(${document.getElementById("contrast").value}%) saturate(${document.getElementById("saturation").value}%)`;
  octx.drawImage(img, crop.sx, crop.sy, crop.s, crop.s, 0,0,boardSize,boardSize);
  octx.filter = "none";

  const data = octx.getImageData(0,0,boardSize,boardSize).data;
  const { labs } = getPixelLabs(data);
  const targetCount = getTargetColorCount();
  const mapped = simplifyToMard(labs, targetCount);

  pattern = [];
  counts = {};

  for (let y=0; y<boardSize; y++) {
    const row = [];
    for (let x=0; x<boardSize; x++) {
      const bead = mapped[y*boardSize+x];
      row.push(bead);
      counts[bead.code] = (counts[bead.code] || 0) + 1;
    }
    pattern.push(row);
  }

  redraw();
  renderStats();

  const actual = Object.keys(counts).length;
  paletteStatus.textContent = targetCount
    ? `MARD 291 已内置 · 简化目标 ${targetCount} 色 · 实际使用 ${actual} 色`
    : `MARD 291 已内置 · 不限制颜色 · 实际使用 ${actual} 色`;
}

function redraw() {
  const showCoords = document.getElementById("showCoords").checked;
  const margin = showCoords ? 60 : 20;
  const cell = boardSize === 52 ? 18 : boardSize === 78 ? 15 : 12;
  const drawSize = boardSize * cell;

  canvas.width = drawSize + margin + 20;
  canvas.height = drawSize + margin + 20;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for (let y=0; y<boardSize; y++) {
    for (let x=0; x<boardSize; x++) {
      const bead = pattern[y][x];
      const px = margin + x*cell;
      const py = margin + y*cell;

      ctx.fillStyle = mode === "code" ? "#fff" : bead.hex;
      ctx.fillRect(px,py,cell,cell);

      const shouldCode = mode === "code" || (mode === "pattern" && document.getElementById("showCodes").checked);
      if (shouldCode) drawCode(bead, px, py, cell);
    }
  }

  drawGrid(margin, margin, drawSize, cell);
  if (showCoords) drawCoords(margin,margin,cell);
}

function drawCode(bead, px, py, cell) {
  const rgb = {r:bead.r,g:bead.g,b:bead.b};
  const brightness = (rgb.r*299 + rgb.g*587 + rgb.b*114)/1000;
  ctx.font = `${Math.max(5, Math.floor(cell*0.34))}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = mode === "code" ? "#111" : (brightness < 140 ? "#fff" : "#111");
  ctx.fillText(bead.code, px+cell/2, py+cell/2);
}

function drawGrid(sx,sy,drawSize,cell) {
  const bold5 = document.getElementById("bold5").checked;
  for (let i=0;i<=boardSize;i++) {
    let width = 0.5;
    let color = "rgba(0,0,0,.28)";
    if (bold5 && i % 5 === 0) { width = 2; color = "rgba(0,0,0,.95)"; }
    if (i===0 || i===boardSize) { width = 2.5; color = "#000"; }

    const x = sx + i*cell;
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.moveTo(x,sy);
    ctx.lineTo(x,sy+drawSize);
    ctx.stroke();

    const y = sy + i*cell;
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.moveTo(sx,y);
    ctx.lineTo(sx+drawSize,y);
    ctx.stroke();
  }
}

function drawCoords(sx,sy,cell) {
  ctx.fillStyle = "#111";
  ctx.font = "11px Arial";
  ctx.textBaseline = "middle";

  ctx.textAlign = "center";
  for (let x=0;x<boardSize;x++) {
    const n=x+1;
    if (n===1 || n%5===0 || n===boardSize) {
      ctx.fillText(n, sx+x*cell+cell/2, sy-15);
    }
  }

  ctx.textAlign = "right";
  for (let y=0;y<boardSize;y++) {
    const n=y+1;
    if (n===1 || n%5===0 || n===boardSize) {
      ctx.fillText(n, sx-10, sy+y*cell+cell/2);
    }
  }
}

function renderStats() {
  document.getElementById("sumSize").textContent = `${boardSize}×${boardSize}`;
  document.getElementById("sumTotal").textContent = boardSize*boardSize;
  document.getElementById("sumColors").textContent = Object.keys(counts).length;

  const list = document.getElementById("colorList");
  list.innerHTML = "";

  Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .forEach(([code,count]) => {
      const bead = palette.find(x => x.code === code);
      const row = document.createElement("div");
      row.className = "color-row";
      row.innerHTML = `
        <div class="swatch" style="background:${bead.hex}"></div>
        <div>
          <strong>${code}</strong>
          <div class="small">${count} 颗 · ${bead.hex}</div>
        </div>`;
      list.appendChild(row);
    });
}

function download() {
  if (!pattern.length) return alert("请先生成图纸");

  // 按用量从高到低整理材料表
  const entries = Object.entries(counts)
    .sort((a,b) => b[1] - a[1])
    .map(([code, count]) => {
      const bead = palette.find(x => x.code === code);
      return { bead, count };
    });

  const exportWidth = Math.max(canvas.width, 1000);
  const topPadding = 40;
  const titleHeight = 60;
  const gap = 34;

  // 材料表：每行 4 个颜色
  const cols = 4;
  const itemW = Math.floor((exportWidth - 80) / cols);
  const itemH = 54;
  const rows = Math.ceil(entries.length / cols);
  const legendTitleH = 52;
  const legendHeight = legendTitleH + rows * itemH + 40;

  // 图纸居中放置
  const patternX = Math.floor((exportWidth - canvas.width) / 2);
  const patternY = topPadding + titleHeight;

  const exportHeight = patternY + canvas.height + gap + legendHeight;

  const out = document.createElement("canvas");
  out.width = exportWidth;
  out.height = exportHeight;
  const o = out.getContext("2d");

  // 白底
  o.fillStyle = "#ffffff";
  o.fillRect(0, 0, exportWidth, exportHeight);

  // 标题
  o.fillStyle = "#111";
  o.textAlign = "center";
  o.textBaseline = "middle";
  o.font = "bold 28px Arial, Microsoft YaHei, sans-serif";
  o.fillText(`MARD 291 拼豆图纸 · ${boardSize}×${boardSize}`, exportWidth / 2, 38);

  // 图纸
  o.drawImage(canvas, patternX, patternY);

  // 材料区
  const legendY = patternY + canvas.height + gap;

  o.fillStyle = "#111";
  o.textAlign = "left";
  o.font = "bold 22px Arial, Microsoft YaHei, sans-serif";
  o.fillText("材料清单", 40, legendY + 22);

  o.font = "14px Arial, Microsoft YaHei, sans-serif";
  o.fillStyle = "#666";
  o.fillText(
    `共 ${boardSize * boardSize} 颗 · ${entries.length} 种颜色`,
    150,
    legendY + 22
  );

  const startY = legendY + legendTitleH;

  entries.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const x = 40 + col * itemW;
    const y = startY + row * itemH;

    // 色块
    o.fillStyle = item.bead.hex;
    o.fillRect(x, y + 8, 30, 30);
    o.strokeStyle = "#888";
    o.lineWidth = 1;
    o.strokeRect(x + 0.5, y + 8.5, 29, 29);

    // 色号
    o.fillStyle = "#111";
    o.font = "bold 15px Arial, Microsoft YaHei, sans-serif";
    o.textAlign = "left";
    o.fillText(item.bead.code, x + 42, y + 19);

    // 数量
    o.font = "14px Arial, Microsoft YaHei, sans-serif";
    o.fillStyle = "#444";
    o.fillText(`${item.count} 颗`, x + 42, y + 38);
  });

  const a = document.createElement("a");
  a.download = `MARD291-${boardSize}x${boardSize}-pattern-and-materials.png`;
  a.href = out.toDataURL("image/png");
  a.click();
}

paletteStatus.textContent = `MARD 291 色卡已内置：${palette.length} 色（无需联网加载）`;
